version: '3.8'

services:
  gateway:
    build: .
    container_name: safe_ai_gateway
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    depends_on:
      - redis

  redis:
    image: redis/redis-stack:latest
    container_name: safe_ai_redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
